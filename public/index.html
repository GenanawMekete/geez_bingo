<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geez Bingo - WebApp</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto;background:#f3f4f6;margin:0;color:#0f172a}
.wrap{max-width:980px;margin:12px auto;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center}
.controls{display:flex;gap:8px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{background:#fff;padding:12px;border-radius:8px;text-align:center;font-weight:700;border:1px solid #e6e6e6;cursor:pointer}
.cell.marked{background:#10b981;color:white}
.pill{display:inline-block;padding:6px 8px;border-radius:999px;background:#111827;color:#fff;margin:2px}
.button{padding:10px;border-radius:8px;border:0;background:#7c3aed;color:#fff;cursor:pointer}
.small{font-size:13px;color:#475569}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h2>Geez Bingo</h2>
    <div class="small" id="uid"></div>
  </div>

  <div class="controls">
    <button id="create" class="button">Create</button>
    <input id="joinid" placeholder="Game ID" style="padding:8px;border-radius:8px;border:1px solid #e6e6e6">
    <button id="join" class="button">Join</button>
    <button id="start" class="button">Start Auto Draw</button>
  </div>

  <div>Game: <span id="gameid">-</span> | Last: <span id="last">-</span></div>
  <div style="margin-top:8px" id="drawn" class="small"></div>

  <h3>Your Card</h3>
  <div id="card" class="grid"></div>
  <div style="margin-top:8px"><button id="bingo" class="button">BINGO!</button></div>
  <div id="msg" class="small" style="margin-top:8px"></div>
</div>

<script>
const API = '';
let user = { id: Date.now(), name: 'Guest' };
document.getElementById('uid').textContent = 'User ' + user.id;

let state = { gameId:null, card: null, marked: [], drawn: [] };

async function api(path, opts){ const r = await fetch(API + path, opts); if(!r.ok) throw new Error(await r.text()); return r.json(); }

function renderCard(){
  const el = document.getElementById('card');
  el.innerHTML='';
  const card = state.card || generateCard();
  card.forEach(n=>{
    const b = document.createElement('button');
    b.className='cell' + (state.marked.includes(n) ? ' marked' : '');
    b.textContent = n;
    b.onclick = ()=> {
      if(state.marked.includes(n)) state.marked = state.marked.filter(x=>x!==n); else state.marked.push(n);
      b.classList.toggle('marked');
    };
    el.appendChild(b);
  });
}

function generateCard(){
  const ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
  const cols = ranges.map(r=>{
    const a=[];
    while(a.length<5){
      const n = Math.floor(Math.random()*(r[1]-r[0]+1))+r[0];
      if(!a.includes(n)) a.push(n);
    }
    return a;
  });
  const flat=[];
  for(let i=0;i<5;i++) for(let j=0;j<5;j++) flat.push(cols[j][i]);
  flat[12] = 'FREE';
  state.card = flat;
  return flat;
}

document.getElementById('create').addEventListener('click', async ()=>{
  try{
    const r = await api('/api/game/create', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ user_id: user.id })});
    state.gameId = r.game_id;
    document.getElementById('gameid').textContent = state.gameId;
    const j = await api('/api/game/join', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ user_id: user.id, full_name: user.name, game_id: state.gameId })});
    state.card = j.card; state.marked=[]; renderCard(); startPoll();
  }catch(e){ alert('Create error '+e.message) }
});

document.getElementById('join').addEventListener('click', async ()=>{
  try{
    const gid = document.getElementById('joinid').value.trim();
    if(!gid) return alert('enter game id');
    const j = await api('/api/game/join', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ user_id: user.id, full_name: user.name, game_id: gid })});
    state.gameId = gid; document.getElementById('gameid').textContent = gid; state.card = j.card; state.marked=[]; renderCard(); startPoll();
  }catch(e){ alert('Join error '+e.message) }
});

document.getElementById('start').addEventListener('click', async ()=>{
  if(!state.gameId) return alert('no game');
  await api('/api/game/start', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ game_id: state.gameId })});
  alert('Auto draw started');
});

document.getElementById('bingo').addEventListener('click', async ()=>{
  if(!state.gameId) return alert('no game');
  try{
    const r = await api('/api/game/check-bingo', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ game_id: state.gameId, user_id: user.id, marked: state.marked })});
    if(r.win) document.getElementById('msg').textContent = '🎉 BINGO!'; else document.getElementById('msg').textContent = 'Not valid: ' + (r.reason||'');
  }catch(e){ alert('Check error '+e.message) }
});

async function pollOnce(){
  if(!state.gameId) return;
  try{
    const r = await api('/api/game/draws/' + encodeURIComponent(state.gameId));
    state.drawn = r.drawn || [];
    const drawnEl = document.getElementById('drawn'); drawnEl.innerHTML='';
    state.drawn.forEach(n=>{
      const d = document.createElement('span'); d.className='pill'; d.textContent = n; drawnEl.appendChild(d);
    });
    document.getElementById('last').textContent = state.drawn.length ? state.drawn[state.drawn.length-1] : '-';
  }catch(e){ console.warn('poll', e); }
}

let pollTimer = null;
function startPoll(){ if(pollTimer) clearInterval(pollTimer); pollTimer = setInterval(pollOnce, 1500); pollOnce(); }

renderCard();
</script>
</body>
</html>
